# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Evals del asistente multiagente de Parachute S.A. (arquitectura jerarquica)

prompts:
  - '{{pregunta}}'

providers:
  - id: file://evals/provider.py
    label: jerarquica
    config:
      # El flujo de agenda pasa por 3 niveles de agentes y el tier gratuito de Groq
      # limita los tokens por minuto, asi que una consulta puede tardar varios minutos.
      timeout: 600000

# Pausa entre casos para que cada uno arranque con el limite de tokens de Groq renovado.
evaluateOptions:
  maxConcurrency: 1
  delay: 30000

defaultTest:
  options:
    # Modelo que califica las assertions de factuality (distinto al del agente para no
    # compartir el limite de tokens por minuto).
    provider:
      id: groq:qwen/qwen3.8-27b
      config:
        temperature: 0
        reasoning_format: hidden
  vars:
    fecha_ideal: file://evals/fechas.py
    fecha_lluvia: file://evals/fechas.py
    fecha_fuera: file://evals/fechas.py

tests:
  # --- Preguntas frecuentes --------------------------------------------------
  - description: 'FAQ: precio del salto tandem'
    vars:
      pregunta: ¿Cuánto cuesta un salto tándem?
    assert:
      - type: factuality
        value: El salto tándem cuesta Q2,200 e incluye equipo, instructor certificado y seguro.
      - type: regex
        value: 'Q\s?2[,.\s]?200'
      - type: javascript
        value: context.providerResponse.metadata.herramientas.some(h => h.nombre === 'buscar_en_faqs')
      - type: latency
        threshold: 30000

  - description: 'FAQ: requisitos de edad y peso'
    vars:
      pregunta: ¿Cuál es la edad mínima y el peso máximo para saltar?
    assert:
      - type: factuality
        value: Hay que ser mayor de 18 años y presentar DPI o pasaporte; el peso máximo para salto tándem es de 100 kg.
      - type: contains
        value: '18'
      - type: regex
        value: '100\s?(kg|kilo)'
      - type: javascript
        value: context.providerResponse.metadata.herramientas.some(h => h.nombre === 'buscar_en_faqs')
      - type: latency
        threshold: 30000

  - description: 'FAQ: horarios de operacion'
    vars:
      pregunta: ¿En qué horarios operan?
    assert:
      - type: factuality
        value: Operan saltos a las 08:00, 10:00, 13:00 y 15:00, con cupo para 2 personas por horario.
      - type: contains-all
        value: ['08:00', '10:00', '13:00', '15:00']
      - type: javascript
        value: context.providerResponse.metadata.herramientas.some(h => h.nombre === 'buscar_en_faqs')
      - type: latency
        threshold: 30000

  - description: 'FAQ: pregunta que no esta en la base de conocimientos'
    vars:
      pregunta: ¿Venden comida en el lugar del salto?
    assert:
      - type: factuality
        value: La base de conocimientos de Parachute S.A. no tiene información sobre venta de comida en el lugar.
      - type: not-regex
        value: 'Q\s?\d'
      - type: javascript
        value: context.providerResponse.metadata.herramientas.some(h => h.nombre === 'buscar_en_faqs')
      - type: latency
        threshold: 30000

  # --- Agenda de citas -------------------------------------------------------
  - description: 'Agenda: cita en un dia con clima ideal'
    vars:
      pregunta: Quiero agendar un salto tándem para el {{fecha_ideal}} a las 10:00. Soy Ana López y mi teléfono es 5555-1111.
    assert:
      - type: factuality
        value: La cita de Ana López quedó confirmada para el {{fecha_ideal}} a las 10:00 porque el clima de ese día es apto para saltar.
      - type: regex
        value: 'PCH-[0-9A-F]{6}'
      - type: javascript
        # Primero se evalua el clima de la fecha y despues se agenda con los datos del cliente.
        value: |
          const h = context.providerResponse.metadata.herramientas;
          const clima = h.findIndex(x => x.nombre === 'evaluar_condiciones_de_salto' && x.argumentos.fecha === context.vars.fecha_ideal);
          const cita = h.findIndex(x => x.nombre === 'agendar_cita' && x.ok === true);
          if (clima === -1 || cita === -1) return false;
          const args = h[cita].argumentos;
          return clima < cita && args.fecha === context.vars.fecha_ideal && args.hora.includes('10') && args.cliente.includes('Ana');
      - type: latency
        threshold: 300000

  - description: 'Agenda: no se agenda en un dia con lluvia'
    vars:
      pregunta: Quiero agendar un salto para el {{fecha_lluvia}} a las 08:00. Soy Luis Pérez, teléfono 5555-2222.
    assert:
      - type: factuality
        value: No se puede agendar el {{fecha_lluvia}} porque las condiciones no son seguras para saltar (hay lluvia).
      - type: not-regex
        value: 'PCH-[0-9A-F]{6}'
      - type: javascript
        value: |
          const h = context.providerResponse.metadata.herramientas;
          return h.some(x => x.nombre === 'evaluar_condiciones_de_salto' && x.argumentos.fecha === context.vars.fecha_lluvia)
            && !h.some(x => x.nombre === 'agendar_cita' && x.ok === true);
      - type: latency
        threshold: 300000

  - description: 'Agenda: fecha fuera de los 16 dias de pronostico'
    vars:
      pregunta: Quiero agendar un salto para el {{fecha_fuera}} a las 10:00. Soy Ana López, teléfono 5555-1111.
    assert:
      - type: factuality
        value: No se puede confirmar la cita porque Open-Meteo solo da pronóstico para los próximos 16 días y esa fecha está fuera de esa ventana.
      - type: regex
        value: '16\s+d[ií]as'
      - type: javascript
        value: '!context.providerResponse.metadata.herramientas.some(x => x.nombre === "agendar_cita" && x.ok === true)'
      - type: latency
        threshold: 300000

  - description: 'Agenda: consulta de clima sin agendar'
    vars:
      pregunta: ¿Cómo estará el clima el {{fecha_ideal}} para saltar?
    assert:
      - type: factuality
        value: Las condiciones del {{fecha_ideal}} son ideales para saltar.
      - type: icontains
        value: ideal
      - type: javascript
        value: |
          const h = context.providerResponse.metadata.herramientas;
          return h.some(x => x.nombre === 'evaluar_condiciones_de_salto' && x.argumentos.fecha === context.vars.fecha_ideal)
            && !h.some(x => x.nombre === 'agendar_cita');
      - type: latency
        threshold: 300000
